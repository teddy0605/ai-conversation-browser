<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Conversation Browser</title>
<style>
  :root {
    --bg: #101216; --panel: #181b21; --panel2: #1f232b; --border: #2a2f3a;
    --text: #e6e9ef; --dim: #8b93a3; --accent: #6ea8fe;
    --code-bg: #0d0f13; --user-bubble: #24344f; --badge-text: #0d0f12;
    --overlay: rgba(0,0,0,.55); --cwd: #a8b8d0;
    --claude-code: #e0803d; --codex: #2dbfa0; --grok: #b07cf0;
    --opencode: #7bc86c; --hermes: #e0575b; --cursor-ide: #5b8def; --cursor-cli: #6fc3e0;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f8; --panel: #ffffff; --panel2: #eef0f4; --border: #d9dde5;
    --text: #1c212b; --dim: #66707f; --accent: #2f6fed;
    --code-bg: #f0f1f5; --user-bubble: #dce8ff; --badge-text: #14171c;
    --overlay: rgba(20,24,32,.35); --cwd: #3d5a85;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 12px 18px 10px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0 12px 0 0; white-space: nowrap; }
  h1 .count { color: var(--dim); font-weight: 400; font-size: 13px; }
  #q {
    flex: 1; min-width: 240px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px;
    outline: none;
  }
  #q:focus { border-color: var(--accent); }
  select, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  select { max-width: 260px; }
  button:hover { border-color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .chip {
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px;
    font-size: 12px; cursor: pointer; color: var(--dim); user-select: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .chip.on { color: var(--text); border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .chip .n { opacity: .6; }
  main { max-width: min(1180px, 94vw); margin: 0 auto; padding: 10px 18px 60px; }
  .item {
    position: relative;
    display: grid; grid-template-columns: 92px minmax(0,1fr) 92px; gap: 7px 14px;
    padding: 17px 14px; border-bottom: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; align-items: baseline;
  }
  .item:hover { background: var(--panel); }
  .item.hiddenRow { opacity: .45; }
  .item.kbSel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .item.selRow { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #hiddenBtn.on, #starredBtn.on, #bulkBtn.on { border-color: var(--accent); color: var(--accent); }
  .selMark {
    display: none; position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border: 2px solid var(--dim); border-radius: 5px;
    align-items: center; justify-content: center;
  }
  body.bulk-mode .item { padding-left: 44px; }
  body.bulk-mode .selMark { display: flex; }
  .item.selRow .selMark { background: var(--accent); border-color: var(--accent); }
  .item.selRow .selMark::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; }
  button:disabled { opacity: .4; cursor: default; }
  button.spinning { position: relative; padding-left: 28px; }
  button.spinning::before {
    content: ""; position: absolute; left: 10px; top: 50%; margin-top: -6px;
    width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .6s linear infinite; opacity: .8;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #topBtn {
    position: fixed; right: 22px; bottom: 22px; z-index: 5;
    padding: 9px 14px; border-radius: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .starToggle { cursor: pointer; font-size: 14px; margin-right: 3px; color: var(--border); }
  .starToggle:hover { color: var(--dim); }
  .starToggle.on { color: #e0b23d; }
  #activityBar { display: flex; align-items: flex-end; gap: 2px; height: 30px; margin: 9px 0 1px; }
  .abar { flex: 1; min-width: 2px; background: var(--accent); opacity: .55; border-radius: 2px 2px 0 0; }
  .abar:hover { opacity: 1; }
  #recentWrap { position: relative; }
  #recentMenu {
    position: absolute; top: calc(100% + 4px); right: 0; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px; z-index: 6;
    min-width: 240px; max-width: 360px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  #recentMenu .rItem {
    padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
    display: flex; gap: 6px; align-items: center; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis;
  }
  #recentMenu .rItem:hover { background: var(--panel2); }
  #recentMenu .rItem.missing { opacity: .5; cursor: default; }
  #recentMenu .empty { padding: 6px 8px; color: var(--dim); font-size: 12px; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px;
    color: var(--badge-text); background: var(--c); text-align: center; white-space: nowrap;
    align-self: center; justify-self: start;
  }
  .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { grid-column: 2; color: var(--dim); font-size: 12px; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .meta .cwd { color: var(--cwd); }
  .snippet { grid-column: 2; color: var(--dim); font-size: 12px; font-style: italic; overflow: hidden;
             display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .snippet b { color: var(--accent); font-style: normal; }
  b.tmatch { color: var(--accent); }
  .right { text-align: right; color: var(--dim); font-size: 12px; white-space: nowrap; }
  .right .msgs { display: block; font-size: 11px; opacity: .8; }
  #empty { color: var(--dim); text-align: center; padding: 60px 0; }

  /* detail overlay */
  #overlay {
    position: fixed; inset: 0; background: var(--overlay); z-index: 10;
    display: none; justify-content: flex-end;
  }
  #overlay.open { display: flex; }
  #panel {
    width: min(860px, 96vw); height: 100%; background: var(--panel);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
  }
  /* split view (wide windows): list on the left, open conversation fills the rest */
  body.split {
    --list-w: clamp(440px, 36vw, 680px);
    display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr); height: 100vh; overflow: hidden;
  }
  body.split header { grid-area: 1 / 1; }
  body.split main { grid-area: 2 / 1; max-width: none; margin: 0; overflow-y: auto; }
  body.split #overlay { left: var(--list-w); background: none; }
  body.split #panel { width: 100%; }
  #phead { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  #phead .title { font-size: 15px; white-space: normal; }
  #phead .sub { color: var(--dim); font-size: 12px; margin-top: 5px; word-break: break-all; }
  #phead .actions { margin-top: 9px; display: flex; gap: 8px; align-items: center; }
  #phead .ro-note { color: var(--dim); font-size: 12px; }
  #psearchbar {
    display: flex; gap: 8px; align-items: center; padding: 8px 18px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #ps {
    flex: 1; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px;
    font-size: 13px; outline: none;
  }
  #ps:focus { border-color: var(--accent); }
  #psCount { color: var(--dim); font-size: 12px; min-width: 52px; text-align: center; }
  mark.hl { background: #7a5e15; color: #fff; border-radius: 3px; padding: 0 1px; }
  mark.hl.cur { background: #d59b26; color: #000; outline: 2px solid #d59b26; }
  #pbody { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .msg { margin: 0 0 12px; max-width: 92%; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .msg .bubble {
    padding: 9px 13px; border-radius: 10px; background: var(--panel2);
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .msg.user { margin-left: auto; }
  .msg.user .bubble { background: var(--user-bubble); }
  .msg.user .who { text-align: right; }
  .bubble pre, .msg.tool pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 11px; overflow-x: auto; font: 12px/1.45 "SF Mono", Menlo, monospace;
    white-space: pre; margin: 6px 0;
  }
  .bubble code, .msg.tool code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px;
                 font: 12px "SF Mono", Menlo, monospace; }
  .msg.tool summary { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.tool pre { max-height: 480px; overflow: auto; }
  .msg.tool pre.out { opacity: .8; }
  .danger { border-color: #7a3438 !important; color: #f0868a; }
  .danger.confirm { background: #5d2427; color: #fff; }
  #loading { color: var(--dim); padding: 30px; text-align: center; }
  .close { margin-left: auto; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Conversations <span class="count" id="count"></span></h1>
    <input id="q" type="search" placeholder='Search titles, folders and content… ("quotes" = exact phrase)' autofocus>
    <select id="cwdSel"><option value="">All folders</option></select>
    <select id="sortSel">
      <option value="updated_at">Newest activity</option>
      <option value="created_at">Newest created</option>
      <option value="msg_count">Most messages</option>
      <option value="title">Title A–Z</option>
      <option value="relevance">Best match (search)</option>
    </select>
    <button id="reindexBtn" title="Rescan all sources for new/changed conversations">⟳ Reindex</button>
    <button id="starredBtn" title="Show only starred conversations">⭐ 0</button>
    <button id="hiddenBtn" title="Toggle visibility of hidden conversations">🙈 0</button>
    <button id="bulkBtn" title="Select multiple conversations to hide/delete at once">☑ Select</button>
    <div id="recentWrap">
      <button id="recentBtn" title="Recently viewed conversations">🕘 Recent</button>
      <div id="recentMenu" hidden></div>
    </div>
    <button id="themeBtn" title="Toggle light/dark theme">🌓</button>
  </div>
  <div class="row" id="bulkBar" style="display:none">
    <span id="bulkCount" style="color:var(--dim);font-size:12px"></span>
    <button id="bulkAllBtn">Select all shown</button>
    <button id="bulkNoneBtn">Clear</button>
    <button id="bulkHideBtn">🙈 Hide selected</button>
    <button id="bulkDeleteBtn" class="danger">🗑 Delete selected</button>
    <button id="bulkCancelBtn">Cancel</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="activityBar"></div>
</header>

<main>
  <div id="list"></div>
  <div id="empty" hidden>No conversations match.</div>
</main>
<button id="topBtn" title="Jump to top" hidden>↑ Top</button>

<div id="overlay">
  <div id="panel">
    <div id="phead"></div>
    <div id="psearchbar">
      <input id="ps" type="search" placeholder="Search in this conversation… (Enter = next, ⇧Enter = previous)">
      <span id="psCount"></span>
      <button id="psPrev" title="Previous match">↑</button>
      <button id="psNext" title="Next match">↓</button>
    </div>
    <div id="pbody"></div>
  </div>
</div>

<script>
// theme: manual choice persisted, else follow the OS
(function () {
  const saved = localStorage.getItem("acb-theme");
  const theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.dataset.theme = theme;
})();

const SOURCES = {
  "claude-code": "Claude Code",
  "codex":       "Codex",
  "grok":        "Grok",
  "opencode":    "OpenCode",
  "hermes":      "Hermes",
  "cursor-ide":  "Cursor IDE",
  "cursor-cli":  "Cursor CLI",
};
const READ_ONLY_HINT = {
  "opencode":   "read-only — delete inside OpenCode",
  "cursor-ide": "read-only — delete inside Cursor",
  "hermes":     "read-only (Hermes DB) — delete inside Hermes",
};

let all = [];                 // full conversation list
let showHidden = false;
let showStarredOnly = false;
let activeSources = new Set(Object.keys(SOURCES));
let ftsMatches = null;        // Map "source/id" -> snippet (null = no active fts query)
let ftsTimer = null, ftsSeq = 0;
let current = null;           // conversation open in detail panel
let currentMsgs = [];         // its loaded transcript (for export)
let renderedRows = [];        // rows currently on screen, for keyboard nav
let selectedIdx = -1;
let bulkMode = false;
let bulkSelected = new Map(); // key(c) -> {source,id}
let bulkAnchorIdx = null;

const $ = id => document.getElementById(id);
const esc = s => (s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = c => c.source + "/" + c.id;
const home = "/Users/";

function shortCwd(cwd) {
  if (!cwd) return "";
  const m = cwd.match(/^\/Users\/[^/]+(\/.*)?$/);
  return m ? "~" + (m[1] || "") : cwd;
}
function relTime(iso) {
  if (!iso) return "—";
  const d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  if (d < 86400 * 30) return Math.floor(d / 86400) + "d ago";
  if (d < 86400 * 365) return Math.floor(d / 86400 / 30) + "mo ago";
  return Math.floor(d / 86400 / 365) + "y ago";
}
function absTime(iso) {
  return iso ? new Date(iso).toLocaleString() : "unknown";
}

// "word word" style query -> word list; a "quoted query" -> single exact phrase
function tokensOf(q) {
  q = q.trim();
  if (q.length >= 2 && q.startsWith('"') && q.endsWith('"')) {
    const inner = q.slice(1, -1).trim();
    return inner ? [inner] : [];
  }
  return q.split(/\s+/).filter(Boolean);
}

// title/folder scorer: EVERY word must appear as a substring (adding words narrows)
function queryScore(q, c) {
  const hay = ((c.title || "") + " " + (c.cwd || "")).toLowerCase();
  let total = 0;
  for (const tok of tokensOf(q.toLowerCase())) {
    const idx = hay.indexOf(tok);
    if (idx < 0) return -1;
    total += tok.length * 3 + Math.max(0, 40 - idx) / 10;
  }
  return total;
}

// regex that highlights query words in titles/paths (built once per render)
function buildTokRe(q) {
  const toks = tokensOf(q).filter(t => t.length >= 2)
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return toks.length ? new RegExp("(" + toks.join("|") + ")", "gi") : null;
}
function hlTokens(text, re) {
  if (!re || !text) return esc(text);
  return text.split(re)
    .map((part, i) => i % 2 ? `<b class="tmatch">${esc(part)}</b>` : esc(part))
    .join("");
}

function render() {
  const q = $("q").value.trim();
  const cwdFilter = $("cwdSel").value;
  const sort = $("sortSel").value;
  let rows = all.filter(c => activeSources.has(c.source) && (showHidden || !c.hidden));
  if (cwdFilter) rows = rows.filter(c => c.cwd === cwdFilter);
  if (showStarredOnly) rows = rows.filter(c => c.starred);

  if (q) {
    const matched = [];
    for (const c of rows) {
      const ts = queryScore(q, c);
      const m = ftsMatches ? ftsMatches.get(key(c)) : undefined;
      if (ts >= 0 || m) {
        c._snippet = m ? m.snippet : undefined;
        // Best match: title matches first, then content matches by bm25 relevance
        c._score = (ts >= 0 ? 8000 + ts : 0) + (m ? 4000 - m.rankIdx : 0);
        matched.push(c);
      }
    }
    rows = matched;
  } else {
    rows.forEach(c => c._snippet = undefined);
  }
  rows.sort((a, b) => {
    if (sort === "relevance" && q) return b._score - a._score;
    if (sort === "title") return (a.title || "").localeCompare(b.title || "");
    if (sort === "msg_count") return (b.msg_count || 0) - (a.msg_count || 0);
    const field = sort === "relevance" ? "updated_at" : sort;
    return (b[field] || "").localeCompare(a[field] || "");
  });

  $("count").textContent = `${rows.length} / ${all.length}`;
  $("empty").hidden = rows.length > 0;
  const hlRe = q ? buildTokRe(q) : null;
  renderedRows = rows.slice(0, 400);
  if (selectedIdx >= renderedRows.length) selectedIdx = renderedRows.length - 1;
  const html = renderedRows.map(c => `
    <div class="item${c.hidden ? " hiddenRow" : ""}${bulkSelected.has(key(c)) ? " selRow" : ""}" data-k="${esc(key(c))}" style="--c:var(--${c.source})">
      <span class="selMark"></span>
      <span class="badge" style="--c:var(--${c.source})">${SOURCES[c.source] || c.source}</span>
      <span class="title">${hlTokens(c.title || "(untitled)", hlRe)}</span>
      <span class="right" title="${esc(absTime(c.updated_at))}">
        <span class="starToggle${c.starred ? " on" : ""}" data-k="${esc(key(c))}" title="Star this conversation">★</span>
        ${relTime(c.updated_at)}
        <span class="msgs">${c.msg_count ?? "?"} msgs</span>
      </span>
      <span class="meta"><span class="cwd">${hlTokens(shortCwd(c.cwd), hlRe) || "(no folder)"}</span>
        · created ${esc(absTime(c.created_at))}</span>
      ${c._snippet ? `<span class="snippet">${snippetHtml(c._snippet)}</span>` : ""}
    </div>`).join("");
  $("list").innerHTML = html + (rows.length > 400
    ? `<div id="empty" style="display:block">…and ${rows.length - 400} more — refine your search.</div>` : "");
  applySelection();
}

function applySelection() {
  const items = $("list").querySelectorAll(".item");
  items.forEach((el, i) => el.classList.toggle("kbSel", i === selectedIdx));
}

function scrollSelectedIntoView() {
  const el = $("list").children[selectedIdx];
  if (el) el.scrollIntoView({ block: "nearest" });
}

function snippetHtml(s) {
  return esc(s).replaceAll("‹", "<b>").replaceAll("›", "</b>");
}

function buildChips() {
  const counts = {};
  for (const c of all) {
    if (showHidden || !c.hidden) counts[c.source] = (counts[c.source] || 0) + 1;
  }
  const nHidden = all.filter(c => c.hidden).length;
  $("hiddenBtn").textContent = `🙈 ${nHidden}`;
  $("hiddenBtn").classList.toggle("on", showHidden);
  $("hiddenBtn").title = showHidden
    ? "Hidden conversations are shown (dimmed) — click to hide them again"
    : `${nHidden} hidden conversation(s) — click to show`;
  const nStarred = all.filter(c => c.starred).length;
  $("starredBtn").textContent = `⭐ ${nStarred}`;
  $("starredBtn").classList.toggle("on", showStarredOnly);
  $("chips").innerHTML = Object.entries(SOURCES)
    .sort((a, b) => a[1].localeCompare(b[1]))
    .map(([s, label]) => `
    <span class="chip ${activeSources.has(s) ? "on" : ""}" data-s="${s}" style="--c:var(--${s})">
      <span class="dot"></span>${label} <span class="n">${counts[s] || 0}</span>
    </span>`).join("");
  renderActivity();
}

function renderActivity() {
  const days = 35;
  const counts = {};
  const now = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    counts[d.toISOString().slice(0, 10)] = 0;
  }
  const rows = all.filter(c => activeSources.has(c.source) && (showHidden || !c.hidden));
  for (const c of rows) {
    if (!c.updated_at) continue;
    const day = c.updated_at.slice(0, 10);
    if (day in counts) counts[day]++;
  }
  const entries = Object.entries(counts).reverse();
  const max = Math.max(1, ...entries.map(([, n]) => n));
  $("activityBar").innerHTML = entries.map(([day, n]) => {
    const h = Math.max(2, Math.round((n / max) * 28));
    return `<div class="abar" style="height:${h}px" title="${day}: ${n} conversation(s)"></div>`;
  }).join("");
}

function buildCwdSelect() {
  const prev = $("cwdSel").value;
  const counts = {};
  for (const c of all) if (c.cwd) counts[c.cwd] = (counts[c.cwd] || 0) + 1;
  const opts = Object.entries(counts).sort((a, b) => b[1] - a[1])
    .map(([cwd, n]) => `<option value="${esc(cwd)}">${esc(shortCwd(cwd))} (${n})</option>`);
  $("cwdSel").innerHTML = `<option value="">All folders</option>` + opts.join("");
  if (prev && counts[prev]) $("cwdSel").value = prev;
}

async function loadList() {
  const r = await fetch("/api/conversations");
  all = (await r.json()).conversations;
  buildChips(); buildCwdSelect(); render();
}

function scheduleFts() {
  clearTimeout(ftsTimer);
  const q = $("q").value.trim();
  if (q.length < 2) { ftsMatches = null; render(); return; }
  ftsTimer = setTimeout(async () => {
    const seq = ++ftsSeq;
    try {
      const r = await fetch("/api/search?q=" + encodeURIComponent(q));
      const { matches } = await r.json();
      if (seq !== ftsSeq) return;             // stale response
      ftsMatches = new Map(matches.map((m, i) =>
        [m.source + "/" + m.id, { snippet: m.snippet, rankIdx: i }]));
      render();
    } catch (e) { /* server briefly busy — fuzzy results still shown */ }
  }, 200);
}

// ---- detail panel ----

function renderBubbleText(text) {
  const parts = text.split(/```(\w*)\n?/);
  // split gives [text, lang, code, text, lang, code, ...]
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 3 === 0) {
      html += esc(parts[i]).replace(/`([^`\n]+)`/g, "<code>$1</code>");
    } else if (i % 3 === 2) {
      html += `<pre>${esc(parts[i])}</pre>`;
    }
  }
  return html;
}

function buildPHead(c) {
  const hint = READ_ONLY_HINT[c.source];
  return `
    <div class="row">
      <span class="badge" style="--c:var(--${c.source})">${SOURCES[c.source] || c.source}</span>
      <span class="title">${esc(c.title || "(untitled)")}</span>
      <button class="close" onclick="closeDetail()">✕ Close</button>
    </div>
    <div class="sub">${esc(c.cwd || "(no folder)")}<br>
      created ${esc(absTime(c.created_at))} · updated ${esc(absTime(c.updated_at))}
      · ${c.msg_count ?? "?"} msgs<br>
      <span style="opacity:.7">${esc(c.origin_path)}</span></div>
    <div class="actions">
      ${c.deletable
        ? `<button class="danger" id="delBtn" onclick="deleteCurrent(this)">🗑 Move to Trash</button>`
        : `<span class="ro-note">🔒 ${esc(hint || "read-only")}</span>`}
      <button onclick="toggleStarCurrent()">${c.starred ? "★ Starred" : "☆ Star"}</button>
      <button onclick="hideCurrent(${c.hidden ? 0 : 1})">${c.hidden ? "👁 Unhide" : "🙈 Hide from list"}</button>
      <button onclick="exportCurrent()" title="Download this conversation as a Markdown file">⬇ Export .md</button>
      <button onclick="copyCurrent(this)" title="Copy this conversation as Markdown">📋 Copy</button>
      ${c.cwd ? `<button onclick="revealCurrent()" title="Open this conversation's folder in Finder">📂 Reveal folder</button>` : ""}
    </div>`;
}

function pushRecent(c) {
  let recents = JSON.parse(localStorage.getItem("acb-recent") || "[]");
  recents = recents.filter(r => !(r.source === c.source && r.id === c.id));
  recents.unshift({ source: c.source, id: c.id, title: c.title });
  localStorage.setItem("acb-recent", JSON.stringify(recents.slice(0, 8)));
}

// Wide windows show the list and the open conversation side by side. The list
// then scrolls inside <main> instead of the window, so carry the position over.
const SPLIT_MIN_WIDTH = 1000;
function setSplit(on) {
  if (on === document.body.classList.contains("split")) return;
  const main = document.querySelector("main");
  if (on) {
    const y = window.scrollY;
    document.body.classList.add("split");
    main.scrollTop = y;
  } else {
    const y = main.scrollTop;
    document.body.classList.remove("split");
    window.scrollTo(0, y);
  }
}

async function openDetail(c) {
  current = c;
  $("overlay").classList.add("open");
  if (innerWidth >= SPLIT_MIN_WIDTH) setSplit(true);
  else document.body.style.overflow = "hidden";
  // carry the list search into the conversation so it jumps straight to the match
  const listQ = $("q").value.trim();
  if (listQ) $("ps").value = listQ.replace(/^"|"$/g, "");
  pushRecent(c);
  $("phead").innerHTML = buildPHead(c);
  $("pbody").innerHTML = `<div id="loading">Loading transcript…</div>`;
  try {
    const r = await fetch(`/api/conversations/${encodeURIComponent(c.source)}/${encodeURIComponent(c.id)}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    if (current !== c) return;
    if (!data.messages.length) {
      $("pbody").innerHTML = `<div id="loading">No displayable text messages (tool-only session).</div>`;
      return;
    }
    $("pbody").innerHTML = data.messages.map(m => m.role === "tool" ? `
      <details class="msg tool">
        <summary class="who">⚙ ${esc(m.name)}${m.ts ? " · " + esc(absTime(m.ts)) : ""}
          <code>${esc(m.text.split("\n")[0])}</code></summary>
        <pre>${esc(m.text)}</pre>
        ${m.output != null ? `<pre class="out">${esc(m.output)}</pre>` : ""}
      </details>` : `
      <div class="msg ${m.role === "user" ? "user" : ""}">
        <div class="who">${m.role}${m.ts ? " · " + esc(absTime(m.ts)) : ""}</div>
        <div class="bubble">${renderBubbleText(m.text)}</div>
      </div>`).join("");
    currentMsgs = data.messages;
    if ($("ps").value.trim().length >= 2) {
      psRun();
      // full string not present verbatim (scattered-words match): retry with
      // the longest word so there's still something to jump to
      if (!psMarks.length) {
        const toks = $("ps").value.trim().split(/\s+/);
        if (toks.length > 1) {
          $("ps").value = toks.sort((a, b) => b.length - a.length)[0];
          psRun();
        }
      }
      if (psMarks.length) { $("ps").focus(); $("ps").select(); }
    }
  } catch (e) {
    $("pbody").innerHTML = `<div id="loading">Failed to load: ${esc(e.message)}</div>`;
  }
}

function closeDetail() {
  $("overlay").classList.remove("open");
  setSplit(false);
  document.body.style.overflow = "";
  current = null;
  currentMsgs = [];
  $("ps").value = "";
  psMarks = []; psIdx = -1; $("psCount").textContent = "";
}

// ---- in-transcript search ----
let psMarks = [], psIdx = -1, psTimer = null;

function psClear() {
  for (const m of document.querySelectorAll("#pbody mark.hl")) {
    const p = m.parentNode;
    p.replaceChild(document.createTextNode(m.textContent), m);
    p.normalize();
  }
  psMarks = []; psIdx = -1; $("psCount").textContent = "";
}

function psHighlight(root, q) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue, lower = text.toLowerCase();
    let pos = lower.indexOf(q);
    if (pos < 0) continue;
    const frag = document.createDocumentFragment();
    let last = 0;
    while (pos >= 0) {
      frag.appendChild(document.createTextNode(text.slice(last, pos)));
      const mk = document.createElement("mark");
      mk.className = "hl";
      mk.textContent = text.slice(pos, pos + q.length);
      frag.appendChild(mk);
      last = pos + q.length;
      pos = lower.indexOf(q, last);
    }
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

function psRun() {
  psClear();
  const q = $("ps").value.trim().toLowerCase();
  if (q.length < 2) return;
  psHighlight($("pbody"), q);
  psMarks = [...document.querySelectorAll("#pbody mark.hl")];
  if (psMarks.length) psJump(0);
  else $("psCount").textContent = "0";
}

function psJump(i) {
  if (!psMarks.length) return;
  if (psIdx >= 0) psMarks[psIdx].classList.remove("cur");
  psIdx = ((i % psMarks.length) + psMarks.length) % psMarks.length;
  psMarks[psIdx].classList.add("cur");
  const tool = psMarks[psIdx].closest("details");
  if (tool) tool.open = true;
  psMarks[psIdx].scrollIntoView({ block: "center" });
  $("psCount").textContent = `${psIdx + 1}/${psMarks.length}`;
}

async function deleteCurrent(btn) {
  if (!btn.classList.contains("confirm")) {
    btn.classList.add("confirm");
    btn.textContent = "⚠ Click again to confirm";
    setTimeout(() => { btn.classList.remove("confirm"); btn.textContent = "🗑 Move to Trash"; }, 3500);
    return;
  }
  btn.disabled = true; btn.textContent = "Deleting…";
  const c = current;
  const r = await fetch("/api/delete", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: c.source, id: c.id }),
  });
  const res = await r.json();
  if (!r.ok) {
    btn.disabled = false; btn.classList.remove("confirm");
    btn.textContent = "Failed: " + (res.error || r.status);
    return;
  }
  all = all.filter(x => key(x) !== key(c));
  closeDetail(); buildChips(); buildCwdSelect(); render();
}

function buildMarkdown(c, msgs) {
  const lines = [
    `# ${c.title || "(untitled)"}`,
    "",
    `- **Source**: ${SOURCES[c.source] || c.source}`,
    `- **Folder**: ${c.cwd || "unknown"}`,
    `- **Created**: ${absTime(c.created_at)}`,
    `- **Updated**: ${absTime(c.updated_at)}`,
    `- **Origin**: ${c.origin_path}`,
    "",
    "---",
    "",
  ];
  for (const m of msgs) {
    if (m.role === "tool") continue;  // export stays text-only
    lines.push(`## ${m.role}${m.ts ? ` — ${absTime(m.ts)}` : ""}`, "", m.text, "");
  }
  return lines.join("\n");
}

function exportCurrent() {
  const c = current;
  if (!c) return;
  const blob = new Blob([buildMarkdown(c, currentMsgs)], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const slug = (c.title || c.id).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
  a.download = `${c.source}_${slug || c.id}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function copyCurrent(btn) {
  const c = current;
  if (!c) return;
  await navigator.clipboard.writeText(buildMarkdown(c, currentMsgs));
  const orig = btn.textContent;
  btn.textContent = "✅ Copied!";
  setTimeout(() => { btn.textContent = orig; }, 1500);
}

async function toggleStarCurrent() {
  const c = current;
  if (!c) return;
  c.starred = c.starred ? 0 : 1;
  $("phead").innerHTML = buildPHead(c);
  buildChips();
  await fetch("/api/star", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: c.source, id: c.id, starred: !!c.starred }),
  });
}

async function revealCurrent() {
  const c = current;
  if (!c) return;
  const r = await fetch("/api/reveal", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: c.source, id: c.id }),
  });
  if (!r.ok) {
    const res = await r.json().catch(() => ({}));
    alert(res.error || "Could not open folder");
  }
}

async function hideCurrent(hidden) {
  const c = current;
  await fetch("/api/hide", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: c.source, id: c.id, hidden: !!hidden }),
  });
  c.hidden = hidden ? 1 : 0;
  closeDetail(); buildChips(); render();
}

function toggleStar(k, el) {
  const c = all.find(x => key(x) === k);
  if (!c) return;
  c.starred = c.starred ? 0 : 1;
  el.classList.toggle("on", !!c.starred);
  buildChips();
  if (showStarredOnly && !c.starred) render();
  fetch("/api/star", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: c.source, id: c.id, starred: !!c.starred }),
  });
}

function toggleBulkMode() {
  if (bulkMode) { exitBulkMode(); return; }
  bulkMode = true;
  bulkAnchorIdx = null;
  document.body.classList.add("bulk-mode");
  $("bulkBtn").classList.add("on");
  updateBulkBar();
  render();
}

function exitBulkMode() {
  bulkMode = false;
  bulkAnchorIdx = null;
  bulkSelected.clear();
  document.body.classList.remove("bulk-mode");
  $("bulkBtn").classList.remove("on");
  updateBulkBar();
  buildChips();
  render();
}

function updateBulkBar() {
  const n = bulkSelected.size;
  $("bulkBar").style.display = bulkMode ? "flex" : "none";
  $("bulkCount").textContent = `${n} selected`;
  $("bulkHideBtn").disabled = n === 0;
  $("bulkDeleteBtn").disabled = n === 0;
}

function syncSelRowClasses() {
  $("list").querySelectorAll(".item").forEach(el => {
    el.classList.toggle("selRow", bulkSelected.has(el.dataset.k));
  });
}

function selectAllVisible() {
  for (const c of renderedRows) bulkSelected.set(key(c), { source: c.source, id: c.id });
  syncSelRowClasses();
  updateBulkBar();
}

function clearSelection() {
  bulkSelected.clear();
  syncSelRowClasses();
  updateBulkBar();
}

function renderRecentMenu() {
  const recents = JSON.parse(localStorage.getItem("acb-recent") || "[]");
  if (!recents.length) {
    $("recentMenu").innerHTML = `<div class="empty">No recent conversations yet.</div>`;
    return;
  }
  $("recentMenu").innerHTML = recents.map(r => {
    const exists = all.some(c => c.source === r.source && c.id === r.id);
    return `<div class="rItem${exists ? "" : " missing"}" data-s="${esc(r.source)}" data-i="${esc(r.id)}">
      <span class="badge" style="--c:var(--${r.source})">${SOURCES[r.source] || r.source}</span>
      <span>${esc(r.title || "(untitled)")}</span></div>`;
  }).join("");
}

async function reindexNow(btn) {
  btn.disabled = true; btn.textContent = "⟳ Reindexing…";
  try {
    const response = await fetch("/api/reindex", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || result.ok !== true) {
      throw new Error(result.error || `Reindex failed (${response.status})`);
    }
    await loadList();
  } catch (err) {
    alert(`Reindex failed: ${err.message}`);
  } finally {
    btn.disabled = false; btn.textContent = "⟳ Reindex";
  }
}

// ---- wiring ----
$("q").addEventListener("input", () => { render(); scheduleFts(); });
$("cwdSel").addEventListener("change", render);
$("sortSel").addEventListener("change", render);
$("reindexBtn").addEventListener("click", e => reindexNow(e.target));
$("hiddenBtn").addEventListener("click", () => { showHidden = !showHidden; buildChips(); render(); });
$("themeBtn").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("acb-theme", next);
});
$("chips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const s = chip.dataset.s;
  if (activeSources.has(s) && activeSources.size === 1) {
    activeSources = new Set(Object.keys(SOURCES));   // un-solo
  } else if (e.altKey || e.metaKey) {
    activeSources.has(s) ? activeSources.delete(s) : activeSources.add(s);
  } else if (activeSources.size === Object.keys(SOURCES).length) {
    activeSources = new Set([s]);                    // solo
  } else {
    activeSources.has(s) ? activeSources.delete(s) : activeSources.add(s);
  }
  buildChips(); render();
});
$("starredBtn").addEventListener("click", () => { showStarredOnly = !showStarredOnly; buildChips(); render(); });
$("bulkBtn").addEventListener("click", toggleBulkMode);
$("bulkCancelBtn").addEventListener("click", exitBulkMode);
$("bulkAllBtn").addEventListener("click", selectAllVisible);
$("bulkNoneBtn").addEventListener("click", clearSelection);
$("bulkHideBtn").addEventListener("click", async () => {
  const items = [...bulkSelected.values()];
  if (!items.length) return;
  await fetch("/api/bulk-hide", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items, hidden: true }),
  });
  for (const c of all) if (bulkSelected.has(key(c))) c.hidden = 1;
  exitBulkMode();
});
let bulkDeleteConfirm = false;
let bulkDeleteTimer = null;
$("bulkDeleteBtn").addEventListener("click", async () => {
  const items = [...bulkSelected.values()].filter(it => {
    const c = all.find(x => x.source === it.source && x.id === it.id);
    return c && c.deletable;
  });
  if (!items.length) return;
  if (!bulkDeleteConfirm) {
    bulkDeleteConfirm = true;
    $("bulkDeleteBtn").textContent = `⚠ Click again to delete ${items.length}`;
    bulkDeleteTimer = setTimeout(() => {
      bulkDeleteConfirm = false;
      $("bulkDeleteBtn").textContent = "🗑 Delete selected";
    }, 3500);
    return;
  }
  clearTimeout(bulkDeleteTimer);
  bulkDeleteConfirm = false;
  const btn = $("bulkDeleteBtn");
  btn.disabled = true;
  btn.classList.add("spinning");
  btn.textContent = `Deleting ${items.length}…`;
  $("bulkHideBtn").disabled = true;
  try {
    const r = await fetch("/api/bulk-delete", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items }),
    });
    const { results } = await r.json();
    const okKeys = new Set(results.filter(x => x.ok).map(x => x.source + "/" + x.id));
    all = all.filter(c => !okKeys.has(key(c)));
    bulkSelected.clear();
    exitBulkMode();
    buildCwdSelect();
  } finally {
    btn.classList.remove("spinning");
    btn.textContent = "🗑 Delete selected";
  }
});
$("recentBtn").addEventListener("click", e => {
  e.stopPropagation();
  renderRecentMenu();
  $("recentMenu").hidden = !$("recentMenu").hidden;
});
$("recentMenu").addEventListener("click", e => {
  const item = e.target.closest(".rItem:not(.missing)");
  if (!item) return;
  const c = all.find(x => x.source === item.dataset.s && x.id === item.dataset.i);
  if (c) { $("recentMenu").hidden = true; openDetail(c); }
});
document.addEventListener("click", e => {
  if (!$("recentMenu").hidden && !e.target.closest("#recentWrap")) {
    $("recentMenu").hidden = true;
  }
});
$("list").addEventListener("click", e => {
  const starEl = e.target.closest(".starToggle");
  if (starEl) { e.stopPropagation(); toggleStar(starEl.dataset.k, starEl); return; }
  const item = e.target.closest(".item");
  if (!item) return;
  const k = item.dataset.k;
  const idx = renderedRows.findIndex(x => key(x) === k);
  if (!bulkMode && (e.ctrlKey || e.metaKey)) {
    toggleBulkMode();
    const c = all.find(x => key(x) === k);
    if (c) bulkSelected.set(k, { source: c.source, id: c.id });
    bulkAnchorIdx = idx >= 0 ? idx : null;
    syncSelRowClasses();
    updateBulkBar();
    return;
  }
  if (bulkMode) {
    if (e.shiftKey && bulkAnchorIdx !== null && idx >= 0) {
      const lo = Math.min(bulkAnchorIdx, idx), hi = Math.max(bulkAnchorIdx, idx);
      for (let i = lo; i <= hi; i++) {
        const c = renderedRows[i];
        bulkSelected.set(key(c), { source: c.source, id: c.id });
      }
      syncSelRowClasses();
    } else {
      if (bulkSelected.has(k)) bulkSelected.delete(k);
      else {
        const c = all.find(x => key(x) === k);
        if (c) bulkSelected.set(k, { source: c.source, id: c.id });
      }
      bulkAnchorIdx = idx >= 0 ? idx : bulkAnchorIdx;
      item.classList.toggle("selRow", bulkSelected.has(k));
    }
    updateBulkBar();
    return;
  }
  if (idx >= 0) { selectedIdx = idx; applySelection(); }
  const c = all.find(x => key(x) === k);
  if (c) openDetail(c);
});
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeDetail(); });
$("topBtn").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
window.addEventListener("scroll", () => { $("topBtn").hidden = window.scrollY < 400; });
$("ps").addEventListener("input", () => { clearTimeout(psTimer); psTimer = setTimeout(psRun, 150); });
$("ps").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); psJump(psIdx + (e.shiftKey ? -1 : 1)); }
});
$("psNext").addEventListener("click", () => psJump(psIdx + 1));
$("psPrev").addEventListener("click", () => psJump(psIdx - 1));
document.addEventListener("keydown", e => {
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (!typing && !$("overlay").classList.contains("open") && !bulkMode) {
    if (e.key === "j" || e.key === "ArrowDown") {
      e.preventDefault();
      selectedIdx = Math.min(selectedIdx + 1, renderedRows.length - 1);
      applySelection(); scrollSelectedIntoView();
      return;
    }
    if (e.key === "k" || e.key === "ArrowUp") {
      e.preventDefault();
      selectedIdx = Math.max(selectedIdx - 1, 0);
      applySelection(); scrollSelectedIntoView();
      return;
    }
    if (e.key === "Enter" && selectedIdx >= 0 && renderedRows[selectedIdx]) {
      e.preventDefault();
      openDetail(renderedRows[selectedIdx]);
      return;
    }
  }
  if (e.key === "Escape") {
    if (document.activeElement === $("ps") && $("ps").value) {
      $("ps").value = ""; psClear();
    } else {
      closeDetail();
    }
  }
  if (e.key === "/" && !typing) {
    e.preventDefault();
    ($("overlay").classList.contains("open") ? $("ps") : $("q")).focus();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "f" && $("overlay").classList.contains("open")) {
    e.preventDefault(); $("ps").focus(); $("ps").select();
  }
});

loadList();

// pick up background reindexes: refresh the list every 5 min, but never while
// the user is mid-search, reading a conversation, or in another tab
setInterval(() => {
  if (!document.hidden && !$("q").value && !$("overlay").classList.contains("open")) {
    loadList();
  }
}, 5 * 60 * 1000);
</script>
</body>
